<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета опрос</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-gradient: linear-gradient(135deg, #f5f7fb 0%, #e5e9f5 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #818cf8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Question Screen */
    .question-screen {
      animation: fadeIn 0.35s ease-out;
    }

    .question-number {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question-title {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    .input-field:focus {
      background: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .input-field.error {
      border-color: var(--danger);
      animation: shake 0.3s ease-in-out;
    }

    .error-text {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Final Screen */
    .final-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
      animation: fadeInScale 0.4s ease-out forwards;
    }

    .check-icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ecfdf5;
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      font-size: 2.5rem;
      box-shadow: 0 0 0 12px #f0fdf4;
    }

    .final-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .final-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Индикатор загрузки -->
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Загрузка вопросов...</p>
    </div>

    <!-- Блок опроса -->
    <div id="survey" style="display: none;">
      <div class="progress-container">
        <div class="progress-header">
          <span id="progress-text">Вопрос 1 из 4</span>
          <span id="progress-percent">25%</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="question-screen" id="question-screen">
        <div class="question-number" id="question-badge">Вопрос #1</div>
        <h2 class="question-title" id="question-text">Загрузка...</h2>

        <form id="answer-form" onsubmit="handleAnswerSubmit(event)">
          <div class="form-group">
            <input 
              type="text" 
              id="answer-input" 
              class="input-field" 
              placeholder="Введите ваш ответ..." 
              autocomplete="off"
            />
            <div id="error-msg" class="error-text">Пожалуйста, введите ответ перед тем как продолжить.</div>
          </div>
          <div class="actions">
            <button type="submit" id="submit-btn" class="btn">
              <span>Ответить</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Финальный экран -->
    <div id="final-screen" class="final-screen">
      <div class="check-icon-circle">✓</div>
      <h1 class="final-title">Спасибо!</h1>
      <p class="final-subtitle">Ваши ответы успешно отправлены и сохранены на сервере.</p>
      <button class="btn btn-secondary" onclick="restartSurvey()">Пройти ещё раз</button>
    </div>
  </div>

  <script>
    // Генерируем или читаем уникальный идентификатор сессии
    let sessionId = sessionStorage.getItem('questionnaire_session_id');
    if (!sessionId) {
      sessionId = 'sess_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
      sessionStorage.setItem('questionnaire_session_id', sessionId);
    }

    let questions = [];
    let currentIndex = 0;

    const loadingEl = document.getElementById('loading');
    const surveyEl = document.getElementById('survey');
    const finalScreenEl = document.getElementById('final-screen');
    const questionScreenEl = document.getElementById('question-screen');

    const progressTextEl = document.getElementById('progress-text');
    const progressPercentEl = document.getElementById('progress-percent');
    const progressFillEl = document.getElementById('progress-fill');

    const questionBadgeEl = document.getElementById('question-badge');
    const questionTextEl = document.getElementById('question-text');
    const answerInputEl = document.getElementById('answer-input');
    const submitBtnEl = document.getElementById('submit-btn');
    const errorMsgEl = document.getElementById('error-msg');

    // Базовый адрес API (если открыто не через Spring Boot порт, fallback на 8080)
    const API_BASE = window.location.origin.includes(':') && !window.location.origin.includes('8080') && window.location.protocol === 'file:'
      ? 'http://localhost:8080'
      : '';

    async function loadQuestions() {
      try {
        loadingEl.style.display = 'block';
        surveyEl.style.display = 'none';
        finalScreenEl.style.display = 'none';

        const res = await fetch(`${API_BASE}/questions`);
        if (!res.ok) {
          throw new Error(`Ошибка загрузки: ${res.status}`);
        }
        questions = await res.json();
        
        if (questions && questions.length > 0) {
          currentIndex = 0;
          loadingEl.style.display = 'none';
          surveyEl.style.display = 'block';
          showQuestion(currentIndex);
        } else {
          loadingEl.innerHTML = '<p>Вопросы не найдены.</p>';
        }
      } catch (err) {
        console.error('Ошибка при загрузке вопросов:', err);
        loadingEl.innerHTML = `
          <p style="color: var(--danger); margin-bottom: 16px;">Не удалось подключиться к серверу.</p>
          <button class="btn btn-secondary" onclick="loadQuestions()">Попробовать снова</button>
        `;
      }
    }

    function showQuestion(index) {
      const q = questions[index];
      const total = questions.length;
      const percent = Math.round(((index + 1) / total) * 100);

      progressTextEl.textContent = `Вопрос ${index + 1} из ${total}`;
      progressPercentEl.textContent = `${percent}%`;
      progressFillEl.style.width = `${percent}%`;

      questionBadgeEl.textContent = `Вопрос #${index + 1}`;
      questionTextEl.textContent = q.text;

      answerInputEl.value = '';
      answerInputEl.classList.remove('error');
      errorMsgEl.style.display = 'none';
      submitBtnEl.disabled = false;

      // Перезапуск анимации
      questionScreenEl.style.animation = 'none';
      questionScreenEl.offsetHeight; // trigger reflow
      questionScreenEl.style.animation = 'fadeIn 0.3s ease-out';

      setTimeout(() => answerInputEl.focus(), 50);
    }

    async function handleAnswerSubmit(event) {
      event.preventDefault();

      const answer = answerInputEl.value.trim();
      if (!answer) {
        answerInputEl.classList.add('error');
        errorMsgEl.style.display = 'block';
        answerInputEl.focus();
        return;
      }

      answerInputEl.classList.remove('error');
      errorMsgEl.style.display = 'none';
      submitBtnEl.disabled = true;

      const currentQuestion = questions[currentIndex];

      try {
        const response = await fetch(`${API_BASE}/answers`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            questionId: currentQuestion.id,
            answer: answer,
            sessionId: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`Ошибка сохранения: ${response.status}`);
        }

        // Переход к следующему вопросу или финальному экрану
        if (currentIndex + 1 < questions.length) {
          currentIndex++;
          showQuestion(currentIndex);
        } else {
          showFinalScreen();
        }
      } catch (err) {
        console.error('Ошибка сохранения ответа:', err);
        alert('Не удалось отправить ответ. Проверьте соединение с сервером.');
        submitBtnEl.disabled = false;
      }
    }

    function showFinalScreen() {
      surveyEl.style.display = 'none';
      finalScreenEl.style.display = 'block';
    }

    function restartSurvey() {
      // Генерируем новую сессию для нового прохождения
      sessionId = 'sess_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
      sessionStorage.setItem('questionnaire_session_id', sessionId);
      currentIndex = 0;
      finalScreenEl.style.display = 'none';
      surveyEl.style.display = 'block';
      showQuestion(currentIndex);
    }

    // Запуск при загрузке страницы
    window.addEventListener('DOMContentLoaded', loadQuestions);
  </script>
</body>
</html>
