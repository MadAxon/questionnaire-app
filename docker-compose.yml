services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: questionnaire-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/questions || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
